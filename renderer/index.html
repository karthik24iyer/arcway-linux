<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!-- Mirrors arcway-mac Views/{PopoverView,LoginView,ConnectedView}.swift. Keep them 1:1. -->
<style>
  :root {
    --bg: #ececec; --fg: #1d1d1f; --secondary: #6e6e73; --divider: #d1d1d6; --field: #fff;
    --accent: #0a84ff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --chip: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --fg: #f5f5f7; --secondary: #98989d; --divider: #3a3a3c; --field: #2c2c2e; --chip: rgba(255,255,255,.12); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--bg); color: var(--fg); overflow: hidden; user-select: none; }
  body { font: 13px system-ui, sans-serif; width: 272px; }
  #root { padding: 16px; }
  .center { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0; text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .login { display: flex; flex-direction: column; align-items: stretch; gap: 16px; padding: 8px 10px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .spread { justify-content: space-between; }
  h1 { font-size: 13px; font-weight: 700; }
  .sub { font-size: 12px; }
  .caption { font-size: 11px; }
  .muted { color: var(--secondary); }
  .error { color: var(--red); font-size: 11px; white-space: pre-line; text-align: center; }
  hr { border: 0; border-top: 1px solid var(--divider); width: 100%; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .square { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--chip); }
  .code { font: bold 13px ui-monospace, monospace; padding: 4px 10px; background: var(--chip); border-radius: 5px; align-self: flex-start; }
  .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button { font: inherit; color: inherit; cursor: pointer; }
  .plain { background: none; border: 0; padding: 0; text-align: left; }
  .plain:disabled { cursor: default; }
  .prominent, .bordered { min-height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; }
  .prominent { background: var(--accent); color: #fff; border: 0; font-weight: 500; }
  .bordered { background: var(--chip); border: 0; }
  .prominent:disabled, .bordered:disabled { opacity: .45; cursor: default; }
  .small { min-height: 28px; }
  input[type=text] { font: inherit; font-size: 11px; color: var(--fg); background: var(--field); border: 1px solid var(--divider); border-radius: 5px; padding: 5px 7px; width: 100%; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }

  .switch { position: relative; width: 32px; height: 18px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: absolute; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 9px; background: var(--divider); transition: background .15s; }
  .switch span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { left: 16px; }

  .spinner { width: 14px; height: 14px; border: 2px solid var(--divider); border-top-color: var(--secondary); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ok { color: var(--green); } .warn { color: var(--orange); }
  svg { flex: none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const root = document.getElementById('root');
let state = { type: 'loggedOut' };
let settings = {};
let ui = { loading: null, error: null, pairCode: null, showHookInfo: false };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const spinner = '<div class="spinner"></div>';
const toggle = (key, label, extra = '') =>
  `<label class="row spread sub"><span>${label}</span>${extra}<span class="switch"><input type="checkbox" data-setting="${key}" ${settings[key] ? 'checked' : ''}><span></span></span></label>`;
const statusRow = (ok, okText, action, actionText) =>
  `<div class="row sub"><span class="${ok ? 'ok' : 'warn'}">${ok ? '✔' : '!'}</span>` +
  `<button class="plain ${ok ? 'muted' : 'warn'}" data-action="${action}" ${ok ? 'disabled' : ''}>${ok ? okText : actionText}</button></div>`;

const views = {
  loggedOut: () => `
    <div class="login">
      <h1 style="text-align:center">Arcway</h1>
      ${ui.error ? `<div class="error">${esc(ui.error)}</div>` : ''}
      <div class="stack">
        <button class="prominent" data-action="login-google" ${settings.selfHost || ui.loading ? 'disabled' : ''}>
          ${ui.loading === 'google' ? spinner : 'Sign in with Google'}</button>
        <button class="bordered" data-action="login-apple" ${settings.selfHost || ui.loading ? 'disabled' : ''}>
          ${ui.loading === 'apple' ? spinner : 'Sign in with Apple'}</button>
      </div>
      <hr>
      ${toggle('selfHost', '<span class="caption">Self Host?</span>')}
      ${settings.selfHost ? `
        <input type="text" id="relay-url" placeholder="Relay URL" spellcheck="false" value="${esc(settings.relayUrl)}">
        <button class="prominent small" data-action="pair" ${ui.loading || !settings.relayUrl ? 'disabled' : ''}>
          ${ui.loading === 'pair' ? spinner : 'Pair'}</button>` : ''}
      <button class="plain muted caption" style="align-self:center" data-action="quit">Quit</button>
    </div>`,

  connecting: () => `
    <div class="center">
      <h1>Arcway</h1>
      <div class="row">${spinner}<span class="muted">Connecting...</span></div>
      <button class="plain" data-action="quit">Quit</button>
    </div>`,

  networkOffline: () => `
    <div class="center">
      <h1>Arcway</h1>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="muted">
        <path d="M2 8.8a15 15 0 0 1 4.2-2.6M9.9 4.6A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.7M16.7 11a10 10 0 0 1 2.3 1.9M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M2 2l20 20"/></svg>
      <span class="sub muted">Network Offline</span>
      <button class="prominent" data-action="retry-offline">Retry</button>
      <button class="plain" data-action="quit">Quit</button>
    </div>`,

  installing: () => `
    <div class="center">
      <h1>Arcway</h1>
      ${spinner}
      <span class="caption muted" style="white-space:pre-line">${esc(state.message)}</span>
    </div>`,

  error: () => `
    <div class="center">
      <h1>Arcway</h1>
      <div class="error">${esc(state.message)}</div>
      <button class="prominent" data-action="retry">Retry</button>
    </div>`,

  connected: () => `
    <div class="stack">
      <div class="row"><div class="dot" style="background:var(--green)"></div><h1>Arcway</h1></div>
      <div class="sub">${settings.selfHost ? 'Hello User' : `Hello ${esc(state.userName)}`}</div>
      ${settings.selfHost && ui.pairCode ? `
        <div class="stack" style="gap:4px"><span class="sub">Pair your device with code:</span><span class="code">${esc(ui.pairCode)}</span></div>` : ''}
      <div class="row caption">
        <div class="square" ${state.phoneConnected ? 'style="background:var(--green)"' : ''}></div>
        <span class="ellipsis ${state.phoneConnected ? '' : 'muted'}">${state.phoneConnected
          ? 'Phone Connected' + (state.phoneName ? ` · ${esc(state.phoneName)}` : '') : 'Connected · no phone'}</span>
      </div>
      <hr>
      ${toggle('launchAtLogin', 'Launch at login')}
      ${toggle('keepAwake', 'Keep computer awake')}
      <div class="row spread sub">
        <span style="flex:1">Sync agent commands</span>
        <button class="plain muted" data-action="hook-info" title="Info" style="margin-right:6px">ⓘ</button>
        <span class="switch"><input type="checkbox" data-setting="shellHook" ${settings.shellHook ? 'checked' : ''}><span></span></span>
      </div>
      ${ui.showHookInfo ? `<div class="caption muted">Type 'claude' instead of 'arcway claude' in new terminals. Adds a block to ~/${esc(settings.shellRc)}.</div>` : ''}
      ${statusRow(settings.cliInstalled, 'Terminal command installed', 'install-cli', 'Install <code>arcway</code> terminal command')}
      <hr>
      <button class="plain" data-action="reconnect">Reconnect</button>
      <button class="plain" style="color:var(--red)" data-action="logout">Logout</button>
      <button class="plain" data-action="check-updates">Check for Updates…</button>
      <button class="plain" data-action="quit">Quit</button>
    </div>`,
};

function render() {
  root.innerHTML = (views[state.type] || views.loggedOut)();
  api.invoke('resize', root.getBoundingClientRect().height);
}

async function refresh() {
  settings = await api.invoke('get-settings');
  render();
  if (state.type === 'connected' && settings.selfHost) {
    ui.pairCode = await api.invoke('fetch-pair-code');
    render();
  }
}

async function runLogin(provider, channel) {
  ui.loading = provider;
  ui.error = null;
  render();
  const error = await api.invoke(channel);
  if (ui.loading === provider) { ui.loading = null; ui.error = error; }
  render();
}

root.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = el.dataset.action;
  if (action === 'login-google') return runLogin('google', 'login-google');
  if (action === 'login-apple') return runLogin('apple', 'login-apple');
  if (action === 'pair') {
    await api.invoke('set-setting', 'relayUrl', document.getElementById('relay-url').value.trim());
    return runLogin('pair', 'pair');
  }
  if (action === 'hook-info') { ui.showHookInfo = !ui.showHookInfo; return render(); }
  if (action === 'install-cli') { settings.cliInstalled = await api.invoke('install-cli'); return render(); }
  api.invoke(action);
});

root.addEventListener('change', async (e) => {
  const key = e.target.dataset.setting;
  if (!key) return;
  settings[key] = await api.invoke('set-setting', key, e.target.checked);
  render();
});

root.addEventListener('input', (e) => {
  if (e.target.id !== 'relay-url') return;
  settings.relayUrl = e.target.value;
  api.invoke('set-setting', 'relayUrl', e.target.value);
  const btn = root.querySelector('[data-action="pair"]');
  if (btn) btn.disabled = !!ui.loading || !e.target.value;
});

api.onState((s) => {
  const entered = s.type !== state.type;
  state = s;
  if (entered) refresh(); else render();
});

// Mac LoginView.onAppear / ConnectedView.onAppear: reset login UI, re-read settings, refresh pair code.
api.onShown(() => {
  ui.loading = null;
  ui.error = null;
  refresh();
});

refresh();
</script>
</body>
</html>
